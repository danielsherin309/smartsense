        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;

        /* ================= HEADER ================= */

        header {

        .alerts-section {

<body>

>

<!-- ================= SENSOR CARDS ================= -->

<div class="dashboard">

        </div>

</div>


<script type="module">


    // ==========================================
    // FIREBASE IMPORTS
    // ==========================================

    import { initializeApp }

    from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";


    import {

        getDatabase,

        ref,

        onValue

    }

    from "https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js";


    import {

        getAuth,

        signInWithEmailAndPassword

    }

    from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";


    // ==========================================
    // FIREBASE CONFIGURATION
    // ==========================================

    const firebaseConfig = {

        apiKey: "AIzaSyB5YljHzNbJaqtDxxNyuHks-H62lnqmbYY",

        authDomain: "smartsense-743cc.firebaseapp.com",

        databaseURL: "https://smartsense-743cc-default-rtdb.asia-southeast1.firebasedatabase.app",

        projectId: "smartsense-743cc",

        storageBucket: "smartsense-743cc.firebasestorage.app",

        messagingSenderId:
            "780847497981",

        appId: "1:780847497981:web:aebb411c0c5ae5cbfa7494"

    };


    // ==========================================
    // INITIALIZE FIREBASE
    // ==========================================

    const app =
        initializeApp(firebaseConfig);


    const database =
        getDatabase(app);


    const auth =
        getAuth(app);


    // ==========================================
    // FIREBASE LOGIN
    // ==========================================

    const USER_EMAIL =
        "smartsense.device@gmail.com";


    const USER_PASSWORD =
        "smart123";


    signInWithEmailAndPassword(

        auth,

        USER_EMAIL,

        USER_PASSWORD

    )

    .then(() => {


        console.log(
            "Firebase login successful"
        );


        document.getElementById(
            "status"
        ).innerHTML =
            "🟢 Connected to Firebase";


        startDashboard();


    })


    .catch((error) => {


        console.error(error);


        document.getElementById(
            "status"
        ).innerHTML =
            "🔴 Firebase Login Failed";

    });


    // ==========================================
    // START DASHBOARD
    // ==========================================

    function startDashboard() {


        // ======================================
        // CURRENT SENSOR DATA
        // ======================================

        const deviceRef =

            ref(
                database,
                "devices/ESP32_01"
            );


        onValue(

            deviceRef,

            (snapshot) => {


                const data =
                    snapshot.val();


                if (!data) {

                    return;

                }


                // Temperature

                if (
                    data.temperature
                    !== undefined
                ) {

                    document.getElementById(
                        "temperature"
                    ).innerText =

                        Number(
                            data.temperature
                        ).toFixed(2)
                        + " °C";

                }


                // Humidity

                if (
                    data.humidity
                    !== undefined
                ) {

                    document.getElementById(
                        "humidity"
                    ).innerText =

                        Number(
                            data.humidity
                        ).toFixed(2)
                        + " %";

                }


                // Light

                if (
                    data.light
                    !== undefined
                ) {

                    document.getElementById(
                        "light"
                    ).innerText =
                        data.light;

                }


                // Motion

                if (
                    data.motion
                    !== undefined
                ) {

                    document.getElementById(
                        "motion"
                    ).innerText =

                        data.motion
                        ? "DETECTED"
                        : "NOT DETECTED";

                }


                // Air Quality

                if (
                    data.airQuality
                    !== undefined
                ) {

                    document.getElementById(
                        "airQuality"
                    ).innerText =
                        data.airQuality;

                }

            }

        );


        // ======================================
        // SENSOR HISTORY
        // ======================================

        const historyRef =

            ref(
                database,
                "devices/ESP32_01/history"
            );


        onValue(

            historyRef,

            (snapshot) => {


                const historyData =
                    snapshot.val();


                if (!historyData) {

                    return;

                }


                const records =
                    Object.values(
                        historyData
                    );


                // Sort by timestamp

                records.sort(

                    (a, b) =>

                        Number(
                            a.timestampUnix || 0
                        )
                        -
                        Number(
                            b.timestampUnix || 0
                        )

                );


                // Last 20 readings

                const recentRecords =
                    records.slice(-20);


                // Temperature

                const temperatures =

                    recentRecords.map(

                        record =>

                            Number(
                                record.temperature
                            )

                    );


                drawGraph(

                    "temperatureChart",

                    temperatures,

                    "Temperature (°C)"

                );


                // Humidity

                const humidities =

                    recentRecords.map(

                        record =>

                            Number(
                                record.humidity
                            )

                    );


                drawGraph(

                    "humidityChart",

                    humidities,

                    "Humidity (%)"

                );

            }

        );


        // ======================================
        // ALERTS
        // ======================================

        const alertsRef =

            ref(
                database,
                "devices/ESP32_01/alerts"
            );


        onValue(

            alertsRef,

            (snapshot) => {


                const alertsData =
                    snapshot.val();


                const alertsContainer =
                    document.getElementById(
                        "alerts"
                    );


                if (!alertsData) {


                    alertsContainer.innerHTML =

                        `<div class="no-alerts">
                            ✅ No alerts
                        </div>`;

                    return;

                }


                // Convert Firebase object
                // into an array

                const alerts =

                    Object.values(
                        alertsData
                    );


                // Sort newest first

                alerts.sort(

                    (a, b) =>

                        Number(
                            b.timestampUnix || 0
                        )
                        -
                        Number(
                            a.timestampUnix || 0
                        )

                );


                // Show last 10 alerts

                const recentAlerts =
                    alerts.slice(0, 10);


                alertsContainer.innerHTML =
                    "";


                recentAlerts.forEach(

                    alert => {


                        const alertElement =
                            document.createElement(
                                "div"
                            );


                        alertElement.className =
                            "alert";


                        const title =
                            alert.type
                            || "ALERT";


                        const message =
                            alert.message
                            || "Sensor alert";


                        const value =
                            alert.value
                            !== undefined
                            ? alert.value
                            : "--";


                        const time =
                            alert.timestamp
                            || "TIME NOT AVAILABLE";


                        alertElement.innerHTML = `

                            <div class="alert-title">
                                🚨 ${title}
                            </div>

                            <div class="alert-message">
                                ${message}
                            </div>

                            <div class="alert-value">
                                Value: ${value}
                            </div>

                            <div class="alert-time">
                                🕐 ${time}
                            </div>

                        `;


                        alertsContainer.appendChild(
                            alertElement
                        );

                    }

                );

            }

        );

    }


    // ==========================================
    // DRAW GRAPH
    // ==========================================

    function drawGraph(

        canvasId,

        values,

        label

    ) {


        const canvas =
            document.getElementById(
                canvasId
            );


        const ctx =
            canvas.getContext("2d");


        const width =
            canvas.clientWidth;


        const height =
            canvas.clientHeight;


        canvas.width =
            width;


        canvas.height =
            height;


        ctx.clearRect(
            0,
            0,
            width,
            height
        );


        if (
            values.length === 0
        ) {

            return;

        }


        // ======================================
        // MINIMUM AND MAXIMUM
        // ======================================

        let minValue =
            Math.min(...values);


        let maxValue =
            Math.max(...values);


        if (
            minValue === maxValue
        ) {

            minValue -= 1;

            maxValue += 1;

        }


        const padding = 45;


        // ======================================
        // AXES
        // ======================================

        ctx.beginPath();


        ctx.moveTo(
            padding,
            20
        );


        ctx.lineTo(
            padding,
            height - padding
        );


        ctx.lineTo(
            width - 20,
            height - padding
        );


        ctx.stroke();


        // ======================================
        // GRAPH LINE
        // ======================================

        ctx.beginPath();


        values.forEach(

            (value, index) => {


                const x =

                    padding

                    +

                    (
                        index
                        /
                        Math.max(
                            values.length - 1,
                            1
                        )
                    )

                    *

                    (
                        width
                        -
                        padding
                        -
                        20
                    );


                const y =

                    height
                    -
                    padding

                    -

                    (
                        (
                            value
                            -
                            minValue
                        )

                        /

                        (
                            maxValue
                            -
                            minValue
                        )
                    )

                    *

                    (
                        height
                        -
                        padding
                        -
                        20
                    );


                if (
                    index === 0
                ) {

                    ctx.moveTo(
                        x,
                        y
                    );

                }

                else {

                    ctx.lineTo(
                        x,
                        y
                    );

                }

            }

        );


        ctx.stroke();


        // ======================================
        // DATA POINTS
        // ======================================

        values.forEach(

            (value, index) => {


                const x =

                    padding

                    +

                    (
                        index
                        /
                        Math.max(
                            values.length - 1,
                            1
                        )
                    )

                    *

                    (
                        width
                        -
                        padding
                        -
                        20
                    );


                const y =

                    height
                    -
                    padding

                    -

                    (
                        (
                            value
                            -
                            minValue
                        )

                        /

                        (
                            maxValue
                            -
                            minValue
                        )
                    )

                    *

                    (
                        height
                        -
                        padding
                        -
                        20
                    );


                ctx.beginPath();


                ctx.arc(
                    x,
                    y,
                    4,
                    0,
                    Math.PI * 2
                );


                ctx.fill();

            }

        );


        // ======================================
        // LABEL
        // ======================================

        ctx.font =
            "14px Arial";


        ctx.fillText(
            label,
            padding,
            15
        );


        // ======================================
        // MIN / MAX
        // ======================================

        ctx.font =
            "12px Arial";


        ctx.fillText(

            maxValue.toFixed(1),

            5,

            30

        );


        ctx.fillText(

            minValue.toFixed(1),

            5,

            height - padding

        );

    }

</script>


</body>

</html>
